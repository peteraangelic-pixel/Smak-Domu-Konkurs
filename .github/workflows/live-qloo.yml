name: Test na żywym API Qloo

# Ręczne uruchomienie (Actions → Run workflow) albo po pushu do arena/** ze zmianami w culture-bridge.
# Klucz idzie z sekretu repo QLOO_API_KEY — nigdy nie trafia do kodu ani do logów.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: ["culture-bridge/**", ".github/workflows/live-qloo.yml"]

permissions:
  contents: read

jobs:
  live:
    name: Plan na prawdziwych kotwicach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: culture-bridge

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: culture-bridge/requirements.txt

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Plan na żywym Qloo (Lwów → Poznań)
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          QLOO_BASE_URL: https://hackathon.api.qloo.com
          LLM_PROVIDER: none
        run: |
          if [ -z "$QLOO_API_KEY" ]; then
            echo "Brak sekretu QLOO_API_KEY w repo (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python scripts/live_check.py

      - name: Diagnostyka kształtu odpowiedzi Qloo
        if: always()
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
          QLOO_BASE_URL: https://hackathon.api.qloo.com
        run: python scripts/debug_qloo_shape.py

      - name: Zapisz wynik planu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-qloo-plan
          path: culture-bridge/live_check_result.json
          if-no-files-found: ignore
