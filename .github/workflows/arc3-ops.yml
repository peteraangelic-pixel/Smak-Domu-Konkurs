name: ARC3 read-only top10 research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'kaggle>=2.0'
      - name: Read public sources and own submission status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python arc-agi-3/analysis/read_top10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-top10-research
          path: research/
          retention-days: 7
