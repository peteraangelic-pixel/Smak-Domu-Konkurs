name: ARC3 read-only submission artifact audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade kaggle pandas pyarrow
      - name: Prepare existing Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python arc-agi-3/kaggle/ops/write_creds.py
      - name: Read scored submission and test artifact access
        env:
          KAGGLE_API_TOKEN: ${{ env.KAGGLE_API_TOKEN }}
        run: python arc-agi-3/analysis/audit_submission_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-submission-access-57811453
          path: arc-agi-3/analysis/submission-access-20261031
          retention-days: 7
