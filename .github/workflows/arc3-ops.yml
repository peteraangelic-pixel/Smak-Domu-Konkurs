name: ARC3 read-only leader research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet 'kaggle>=2.0'
      - name: Read public Kaggle data
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p research
          python - <<'PY'
          import json, pathlib, subprocess
          commands = {
              'leaderboard': ['competitions','leaderboard','-c','arc-prize-2026-arc-agi-3','--show'],
              'public_top': ['kernels','list','--competition','arc-prize-2026-arc-agi-3','--sort-by','scoreDescending','--page-size','100','--csv'],
              'leader_notebooks': ['kernels','list','--user','threerabbits','--page-size','100','--csv'],
              'franzen_notebooks': ['kernels','list','--user','dfranzen','--page-size','100','--csv'],
          }
          summary={}
          for name,args in commands.items():
              try:
                  r=subprocess.run(['kaggle',*args],capture_output=True,text=True,timeout=120)
                  pathlib.Path('research',name+'.txt').write_text(r.stdout+'\n'+r.stderr)
                  summary[name]={'returncode':r.returncode,'bytes':len(r.stdout)}
              except subprocess.TimeoutExpired:
                  summary[name]={'error':'timeout'}
          refs = [
              'threerabbits/submission-32b-fix4',
              'romantamrazov/the-agi-boys-i-am-better',
              'vickyfym/arc-agi-3-lalalia-final',
              'tantan0327/arc3-franzen-dprime',
              'heliosli/try-merging-it-you-might-get-lucky-and-win-gold',
          ]
          for ref in refs:
              target = pathlib.Path('research/sources', ref.replace('/','__'))
              target.mkdir(parents=True,exist_ok=True)
              r=subprocess.run(['kaggle','kernels','pull',ref,'--metadata','--path',str(target)],capture_output=True,text=True,timeout=120)
              summary[ref]={'returncode':r.returncode}
              (target/'pull.log').write_text(r.stdout+'\n'+r.stderr)
          pathlib.Path('research/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-leader-research
          path: research/
          retention-days: 7
