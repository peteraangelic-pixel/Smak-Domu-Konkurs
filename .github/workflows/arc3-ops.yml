name: ARC3 ops

# Jedno CLI do operacji Kaggle z TEGO repo (wzorowane na arc3-ops z Pokemon/c87f7a48).
# Sekret KAGGLE_API_TOKEN (repo secret) czytany wyłącznie w runie Actions.
#
# Fire:  edytuj arc-agi-3/kaggle/ops/request.json ({"id","op","args"}) i pushuj,
#        albo Run workflow w UI.
# Read:  zakladka Actions tego repo albo pliki w arc-agi-3/kaggle/ops/results/.
#
# Ops (arc-agi-3/kaggle/ops/ops.py):
#   preflight        — check creds + lista zgłoszeń (read-only)
#   submissions      — lista zgłoszeń (read-only)
#   pull-their-duck  — ściągnij źródło kernela petersharps/arc3-duck (read-only)
#   push-duck200k    — push kernela arc-agi-3/kaggle/duck-200k (Save & Run)
#   submit           — kaggle competitions submit -k (GUARDED: limit dzienny,
#                      tylko po jawnym op; NIE odpala się sam)

on:
  workflow_dispatch:
  push:
    branches: ["arena/5ed750ef-smak-domu-konkurs"]
    paths:
      - "arc-agi-3/kaggle/ops/request.json"
      - ".github/workflows/arc3-ops.yml"

permissions:
  contents: write

concurrency:
  group: arc3-ops
  cancel-in-progress: false

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_CONFIG_DIR: /home/runner/.kaggle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install --upgrade kaggle

      - name: Configure credentials (never echoed)
        run: python3 arc-agi-3/kaggle/ops/write_creds.py

      - name: Run op
        run: python3 arc-agi-3/kaggle/ops/ops.py

      - name: Commit results (ops/results only)
        run: |
          git config user.name "arc3-ops"
          git config user.email "actions@users.noreply.github.com"
          git add arc-agi-3/kaggle/ops/results || true
          if git diff --cached --quiet; then
            echo "No results to commit"
          else
            git commit -m "ops: results ${{ github.run_id }} [skip ci]"
            git push
          fi
