name: ARC3 ops

# Jedno CLI do operacji Kaggle z TEGO repo (wzorowane na arc3-ops z Pokemon).
# Sekret KAGGLE_API_TOKEN czytany wyłącznie w runie Actions (env kroku —
# CLI kaggle>=2.0 czyta go bezposrednio; bez kaggle.json).
#
# Fire:  edytuj arc-agi-3/kaggle/ops/request.json ({"id","op","args"}) i pushuj,
#        albo Run workflow w UI.
# Read:  arc-agi-3/kaggle/ops/results/<id>-<op>/SUMMARY.md (commitowane z powrotem).

on:
  workflow_dispatch:
  push:
    branches: ["arena/5ed750ef-smak-domu-konkurs"]
    paths:
      - "arc-agi-3/kaggle/ops/request.json"
      - ".github/workflows/arc3-ops.yml"

permissions:
  contents: write

concurrency:
  group: arc3-ops
  cancel-in-progress: false

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install --quiet --upgrade "kaggle>=2.0"

      - name: Prepare auth (never echoes the token)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python3 arc-agi-3/kaggle/ops/write_creds.py

      - name: Run op
        env:
          KAGGLE_API_TOKEN: ${{ env.KAGGLE_API_TOKEN }}
        run: python3 arc-agi-3/kaggle/ops/ops.py

      - name: Commit results (always; ops/results only)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arc-agi-3/kaggle/ops/results || true
          if [ -n "$(git status --porcelain arc-agi-3/kaggle/ops/results)" ]; then
            git commit -q -m "ops: results $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
